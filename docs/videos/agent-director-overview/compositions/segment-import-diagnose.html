<template id="segment-import-diagnose-template">
  <div data-composition-id="segment-import-diagnose" data-width="1920" data-height="1080" data-duration="17">
      <section id="scene-import" class="scene">
        <div class="scene-content">
          <div class="topline">
            <span>Typed ingestion</span>
            <span class="signal">four source formats</span>
          </div>
          <div class="evidence-layout">
            <div class="terminal chapter">
              <div><span class="ok">POST</span> /api/traces/import</div>
              <div>{ source: "openai_agents", payload }</div>
              <br />
              <div class="ok">normalized.traceId = "trace_prod_8f3"</div>
              <div>span.parentId = "planner"</div>
              <div>model.provider = "openai"</div>
              <div>tokens.total = 18244</div>
              <div>warnings = ["missing parent span"]</div>
            </div>
            <div class="findings">
              <div class="finding chapter">
                <div class="finding-key">SOURCES</div>
                <div class="finding-value">Agent Director, OpenAI Agents, OTel GenAI, OpenInference</div>
              </div>
              <div class="finding chapter">
                <div class="finding-key">PROVENANCE</div>
                <div class="finding-value">Provider IDs, span IDs, parent IDs, model metadata, costs</div>
              </div>
              <div class="finding chapter">
                <div class="finding-key">WARNINGS</div>
                <div class="finding-value">Duplicate spans, missing parents, impossible timings, exception events</div>
              </div>
            </div>
          </div>
          <div class="caption">
            <strong>Import is not just parsing. It preserves enough truth for investigation and evals.</strong>
            <span class="timecode">00:34</span>
          </div>
        </div>
      </section>


      <section id="scene-diagnose" class="scene">
        <div class="scene-content">
          <div class="topline">
            <span>Diagnose route</span>
            <span class="amber mono">root cause candidate</span>
          </div>
          <div class="evidence-layout">
            <div class="device chapter">
              <img src="assets/readme-trace-to-eval.png" alt="Diagnose route showing root cause and trace-to-eval action" />
            </div>
            <div class="findings">
              <div class="finding chapter">
                <div class="finding-key">CAUSE</div>
                <div class="finding-value">Retrieval drift produced the wrong tool context before the final model call.</div>
              </div>
              <div class="finding chapter">
                <div class="finding-key">COST</div>
                <div class="finding-value">$0.41 concentrated in retry-heavy model spans.</div>
              </div>
              <div class="finding chapter">
                <div class="finding-key">ACTION</div>
                <div class="finding-value">Create eval case from the failed trace and pin it to release gates.</div>
              </div>
            </div>
          </div>
          <div class="caption">
            <strong>Every finding has a route, a reason, and a next action.</strong>
            <span class="timecode">00:43</span>
          </div>
        </div>
      </section>


    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const scenes = [["#scene-import",0,9],["#scene-diagnose",9,8]];
        scenes.forEach(([selector, start, duration], index) => {
          tl.set(selector, { opacity: 1, visibility: "visible" }, start);
          tl.from(selector + " .chapter", { y: 32, opacity: 0, duration: 0.72, stagger: 0.07, ease: "power3.out" }, start + 0.18);
          tl.from(selector + " .caption", { y: 18, opacity: 0, duration: 0.55, ease: "power2.out" }, start + 0.42);
          if (index < scenes.length - 1) {
            tl.to(selector, { opacity: 0, duration: 0.45, ease: "power2.inOut" }, start + duration - 0.45);
            tl.set(selector, { opacity: 0, visibility: "hidden" }, start + duration);
          }
        });
        window.__timelines["segment-import-diagnose"] = tl;
      })();
    </script>
  </div>
</template>
